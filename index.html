<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Feed Reader</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --danger: #f85149;
    --warn: #d29922;
    --tag-bg: #1f2937;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Courier New', 'Consolas', monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #header h1 { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
  #header .subtitle { font-size: 11px; color: var(--muted); }
  .blink { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  #layout { display: flex; flex: 1; overflow: hidden; }

  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); }

  .sidebar-status {
    padding: 8px 12px;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; }
  .dot.loading { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .category-header {
    padding: 10px 12px 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    border-top: 1px solid var(--border);
  }
  .category-header:first-of-type { border-top: none; }

  .feed-item {
    padding: 7px 12px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
    border-left: 2px solid transparent;
  }
  .feed-item:hover { background: var(--bg3); }
  .feed-item.active { background: var(--bg3); border-left-color: var(--accent); color: var(--accent); }
  .feed-item .feed-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed-item .feed-icon { font-size: 10px; color: var(--muted); flex-shrink: 0; }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  #feed-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    min-height: 42px;
  }
  #feed-title { font-size: 13px; font-weight: 700; color: var(--text); }
  #feed-meta { font-size: 11px; color: var(--muted); margin-left: auto; }
  #refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    border-radius: 3px;
    transition: color 0.1s, border-color 0.1s;
  }
  #refresh-btn:hover { color: var(--accent); border-color: var(--accent); }

  #articles {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }
  #articles::-webkit-scrollbar { width: 4px; }
  #articles::-webkit-scrollbar-thumb { background: var(--border); }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
  }
  .placeholder .big { font-size: 32px; }
  .placeholder .hint { font-size: 11px; opacity: 0.6; }

  .loading-msg {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
  }

  .error-msg {
    padding: 20px;
    color: var(--danger);
    font-size: 12px;
  }

  .article-item {
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .article-item:hover { background: var(--bg2); }
  .article-item.open { background: var(--bg2); }

  .article-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 5px;
  }
  .article-item:hover .article-title { color: var(--accent); }

  .article-meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .article-meta span { display: flex; align-items: center; gap: 4px; }

  .article-body {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .article-body.visible { display: block; }
  .article-body p { font-size: 12px; color: var(--muted); line-height: 1.7; font-family: Georgia, serif; margin-bottom: 8px; }
  .article-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 3px;
    transition: border-color 0.1s;
  }
  .article-link:hover { border-color: var(--accent); }

  .tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--muted);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 2px;
    border: 1px solid var(--border);
  }
  .tag.cert { color: var(--warn); border-color: var(--warn); }
  .tag.vuln { color: var(--danger); border-color: var(--danger); }
  .tag.news { color: var(--accent); border-color: var(--accent); }
  .tag.malware { color: #d2a8ff; border-color: #d2a8ff; }
  .tag.exploit { color: var(--danger); border-color: var(--danger); }
  .tag.vendor { color: var(--accent2); border-color: var(--accent2); }
  .tag.community { color: var(--accent2); border-color: var(--accent2); }

  #statusbar {
    padding: 4px 12px;
    font-size: 10px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>&#x25A0; CYBER FEED READER <span class="blink">_</span></h1>
    <div class="subtitle">51 feeds &bull; 8 categories &bull; live intelligence</div>
  </div>
</div>

<div id="layout">
  <div id="sidebar">
    <div class="sidebar-status">
      <div class="dot loading" id="sidebar-dot"></div>
      <span id="sidebar-label">loading feeds...</span>
    </div>
    <div id="feed-list"></div>
  </div>

  <div id="main">
    <div id="feed-header">
      <span id="feed-title" style="color: var(--muted);">select a feed</span>
      <span id="feed-meta"></span>
      <button id="refresh-btn" style="display:none" onclick="refreshFeed()">&#x21bb; refresh</button>
    </div>
    <div id="articles">
      <div class="placeholder">
        <div class="big">&#x25A1;</div>
        <div>select a feed from the sidebar</div>
        <div class="hint">51 cybersecurity sources &bull; click any feed to load articles</div>
      </div>
    </div>
  </div>
</div>

<div id="statusbar" id="statusbar">ready</div>

<script>
const README_URL = 'https://raw.githubusercontent.com/mr-r3b00t/cyber_rss/refs/heads/main/README.md';
const PROXY = 'https://api.allorigins.win/get?url=';

let feeds = [];
let currentFeed = null;
let openArticle = null;

const categoryTags = {
  cert: 'cert', news: 'news', vulnerability: 'vuln',
  vendor_advisory: 'vendor', vendor_blog: 'vendor',
  malware_research: 'malware', exploit_research: 'exploit', community: 'community'
};

const categoryIcons = {
  cert: '&#x26A0;', news: '&#x1F4F0;', vulnerability: '&#x1F6A8;',
  vendor_advisory: '&#x1F4E6;', vendor_blog: '&#x1F4DD;',
  malware_research: '&#x1F9EC;', exploit_research: '&#x1F4A3;', community: '&#x1F465;'
};

function setStatus(msg) {
  document.getElementById('statusbar').textContent = msg;
}

function parseReadme(md) {
  const results = [];
  let currentCat = 'uncategorized';
  for (const line of md.split('\n')) {
    const catMatch = line.match(/^## (.+)/);
    if (catMatch) { currentCat = catMatch[1].trim().replace(/\s*\(\d+\)/, ''); continue; }
    const feedMatch = line.match(/^\s*-\s*\[(.+?)\]\((.+?)\)/);
    if (feedMatch) results.push({ name: feedMatch[1], url: feedMatch[2], category: currentCat });
  }
  return results;
}

function buildSidebar(feeds) {
  const list = document.getElementById('feed-list');
  const categories = {};
  for (const f of feeds) {
    if (!categories[f.category]) categories[f.category] = [];
    categories[f.category].push(f);
  }
  let html = '';
  for (const [cat, items] of Object.entries(categories)) {
    const label = cat.replace(/_/g, ' ');
    const icon = categoryIcons[cat] || '&#x25B8;';
    html += `<div class="category-header">${icon} ${label} (${items.length})</div>`;
    for (const f of items) {
      const idx = feeds.indexOf(f);
      html += `<div class="feed-item" data-idx="${idx}" onclick="selectFeed(${idx})">
        <span class="feed-name">${f.name}</span>
      </div>`;
    }
  }
  list.innerHTML = html;
  document.getElementById('sidebar-dot').classList.remove('loading');
  document.getElementById('sidebar-label').textContent = `${feeds.length} feeds ready`;
}

async function loadFeeds() {
  try {
    setStatus('fetching feed list from github...');
    const resp = await fetch(PROXY + encodeURIComponent(README_URL));
    const data = await resp.json();
    feeds = parseReadme(data.contents);
    buildSidebar(feeds);
    setStatus(`loaded ${feeds.length} feeds across 8 categories`);
  } catch (e) {
    document.getElementById('sidebar-label').textContent = 'failed to load';
    document.getElementById('feed-list').innerHTML = '<div style="padding:12px;font-size:11px;color:var(--danger)">error loading feed list. check console.</div>';
    setStatus('error: ' + e.message);
  }
}

function selectFeed(idx) {
  currentFeed = idx;
  openArticle = null;
  document.querySelectorAll('.feed-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.feed-item[data-idx="${idx}"]`)?.classList.add('active');
  const f = feeds[idx];
  document.getElementById('feed-title').textContent = f.name;
  document.getElementById('feed-title').style.color = 'var(--text)';
  const tag = categoryTags[f.category] || 'tag';
  document.getElementById('feed-meta').innerHTML = `<span class="tag ${tag}">${f.category.replace(/_/g,' ')}</span>`;
  document.getElementById('refresh-btn').style.display = 'inline';
  loadArticles(f);
}

function refreshFeed() {
  if (currentFeed !== null) {
    openArticle = null;
    loadArticles(feeds[currentFeed]);
  }
}

async function loadArticles(feed) {
  const container = document.getElementById('articles');
  container.innerHTML = '<div class="loading-msg"><span class="dot loading"></span> fetching ' + feed.name + '...</div>';
  setStatus('fetching: ' + feed.url);
  try {
    const resp = await fetch(PROXY + encodeURIComponent(feed.url));
    const data = await resp.json();
    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, 'text/xml');
    const items = Array.from(xml.querySelectorAll('item, entry'));
    if (!items.length) throw new Error('no items found in feed');
    renderArticles(items, feed);
    setStatus(`loaded ${items.length} articles from ${feed.name}`);
  } catch (e) {
    container.innerHTML = `<div class="error-msg">&#x26A0; failed to load feed<br><br><span style="font-size:10px;opacity:0.7">${e.message}<br><br>Some feeds block proxy access. Try another feed.</span></div>`;
    setStatus('error loading feed: ' + e.message);
  }
}

function getNodeText(item, ...selectors) {
  for (const sel of selectors) {
    const el = item.querySelector(sel);
    if (el) return el.textContent.trim();
  }
  return '';
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function formatDate(str) {
  if (!str) return '';
  try {
    const d = new Date(str);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) + ' ' +
           d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  } catch { return str.substring(0, 16); }
}

function renderArticles(items, feed) {
  const tag = categoryTags[feed.category] || '';
  const container = document.getElementById('articles');
  let html = '';
  items.forEach((item, i) => {
    const title = getNodeText(item, 'title');
    const link = item.querySelector('link')?.textContent?.trim() ||
                 item.querySelector('link')?.getAttribute('href') || '#';
    const date = formatDate(getNodeText(item, 'pubDate', 'published', 'updated', 'dc\\:date'));
    const desc = stripHtml(getNodeText(item, 'description', 'summary', 'content\\:encoded', 'content'));
    const short = desc.length > 300 ? desc.substring(0, 300) + '…' : desc;
    html += `<div class="article-item" id="art-${i}" onclick="toggleArticle(${i}, '${link.replace(/'/g,"\\'")}')">
      <div class="article-title">${title || '(no title)'}</div>
      <div class="article-meta">
        ${date ? `<span>&#x1F554; ${date}</span>` : ''}
        <span class="tag ${tag}">${feed.category.replace(/_/g,' ')}</span>
      </div>
      <div class="article-body" id="body-${i}">
        <p>${short || '(no description)'}</p>
        <a class="article-link" href="${link}" target="_blank" rel="noopener">open article &#x2197;</a>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

function toggleArticle(i, link) {
  const body = document.getElementById('body-' + i);
  const item = document.getElementById('art-' + i);
  if (openArticle === i) {
    body.classList.remove('visible');
    item.classList.remove('open');
    openArticle = null;
  } else {
    if (openArticle !== null) {
      document.getElementById('body-' + openArticle)?.classList.remove('visible');
      document.getElementById('art-' + openArticle)?.classList.remove('open');
    }
    body.classList.add('visible');
    item.classList.add('open');
    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    openArticle = i;
  }
}

loadFeeds();
</script>
</body>
</html>
