<!DOCTYPE html>
<html lang="en" data-skin="aero">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Feed Reader</title>
<script>
  // Prevent flash of unstyled skin
  (function(){var s=localStorage.getItem('bs-skin');if(s)document.documentElement.setAttribute('data-skin',s);})();
</script>
<link rel="stylesheet" href="css/skins.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header">
  <button id="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">&#x2630;</button>
  <div style="flex:1;min-width:0">
    <h1>&#x25A0; CYBER FEED READER <span class="blink">_</span></h1>
    <div id="subtitle">loading 45 feeds…</div>
  </div>
  <button id="refresh-btn" onclick="refresh()" disabled>&#x21bb; refresh</button>
</div>

<div id="layout">

  <div id="sidebar">
    <div id="sidebar-inner">
      <div class="sidebar-status">
        <div class="dot loading" id="sidebar-dot"></div>
        <span id="sidebar-label">loading…</span>
      </div>
      <div id="feed-list">
        <div class="sidebar-all-item" id="all-feeds-btn" onclick="selectAll()">
          &#x25A0; All Feeds
          <span class="count"></span>
        </div>
      </div>
    </div>
  </div>
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <div id="main">

    <div id="filter-bar">
      <button class="filter-btn active" data-cat="all"              onclick="setFilter('all')">All</button>
      <button class="filter-btn"        data-cat="cert"             onclick="setFilter('cert')">&#x26A0; CERT</button>
      <button class="filter-btn"        data-cat="news"             onclick="setFilter('news')">&#x1F4F0; News</button>
      <button class="filter-btn"        data-cat="vulnerability"    onclick="setFilter('vulnerability')">&#x1F6A8; Vulns</button>
      <button class="filter-btn"        data-cat="vendor_advisory"  onclick="setFilter('vendor_advisory')">&#x1F4E6; Advisory</button>
      <button class="filter-btn"        data-cat="vendor_blog"      onclick="setFilter('vendor_blog')">&#x1F4DD; Vendor Blog</button>
      <button class="filter-btn"        data-cat="malware_research" onclick="setFilter('malware_research')">&#x1F9EC; Malware</button>
      <button class="filter-btn"        data-cat="exploit_research" onclick="setFilter('exploit_research')">&#x1F4A3; Exploits</button>
      <button class="filter-btn"        data-cat="community"        onclick="setFilter('community')">&#x1F465; Community</button>
    </div>

    <div id="feed-header" style="display:none">
      <span id="feed-title"></span>
      <span id="feed-meta"></span>
    </div>

    <div id="progress-wrap"><div id="progress-bar"></div></div>

    <div id="articles">
      <div class="placeholder">
        <div class="big">&#x25A1;</div>
        <div>loading feeds…</div>
      </div>
    </div>

  </div>
</div>

<div id="statusbar">initialising…</div>

<script src="js/feeds.js"></script>
<script src="js/skin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
